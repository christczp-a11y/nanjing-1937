html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}

.lbl{position:absolute;font-family:Mont;font-weight:900;color:#fff;font-size:46px;text-shadow:0 4px 0 #000,0 0 18px #000;letter-spacing:2px}
.jp{color:#ff9b7f}.cn{color:#a9c9ff}
.face{position:absolute;width:250px;height:250px;border-radius:50%;border:8px solid #4d86ec;background-size:cover;background-position:center 25%;filter:grayscale(1) contrast(1.2);box-shadow:0 12px 0 rgba(0,0,0,.5)}
.pol{position:absolute;background:#f4f1ea;padding:16px 16px 60px;box-shadow:0 20px 40px rgba(0,0,0,.6)}
.pol img{display:block;width:100%;filter:grayscale(1) contrast(1.15)}
.pol div{position:absolute;bottom:14px;left:16px;font:800 26px Mont;color:#222}
