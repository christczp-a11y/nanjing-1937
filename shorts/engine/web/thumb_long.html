<!doctype html><html><head><meta charset="utf-8"><style>

html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#000}
.abs{position:absolute}

.pol{position:absolute;background:#efebe2;padding:10px 10px 40px;box-shadow:0 16px 36px rgba(0,0,0,.7)}
.pol img{display:block;width:100%;filter:grayscale(1) contrast(1.2) brightness(.95)}
.pol div{position:absolute;bottom:9px;left:12px;font:700 18px Mont;color:#222;letter-spacing:1px}
